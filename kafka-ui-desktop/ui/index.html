<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kafka UI</title>
  <style>
    :root { --bg: #f1f2f3; --fg: #171a1c; --muted: #73848c; --accent: #4f4ffe; --err: #e51a1a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171a1c; --fg: #f1f2f3; --muted: #a3aeb4; --accent: #7a7aff; --err: #ff6b6b; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    main { text-align: center; max-width: 640px; padding: 16px; }
    .spinner {
      width: 32px; height: 32px; margin: 0 auto 16px;
      border: 3px solid var(--muted); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { color: var(--muted); }
    pre {
      display: none; text-align: left; white-space: pre-wrap; word-break: break-word;
      color: var(--err); font-size: 12px; max-height: 50vh; overflow: auto;
    }
    body.failed .spinner { display: none; }
    body.failed pre { display: block; }
  </style>
</head>
<body>
  <main>
    <div class="spinner"></div>
    <h2>Kafka UI</h2>
    <p id="status">Starting backend…</p>
    <pre id="error"></pre>
  </main>
  <script>
    // Called from the Rust side via window.eval().
    window.showError = function (message) {
      document.body.classList.add('failed');
      document.getElementById('status').textContent = 'Backend failed to start.';
      document.getElementById('error').textContent = message;
    };
  </script>
</body>
</html>
